name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days without activity.
# This writes a heartbeat row once a day through the app's /api/keepalive endpoint.
on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write heartbeat
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://seanw.me' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/keepalive?source=github"
